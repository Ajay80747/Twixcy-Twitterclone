spring.application.name=customer-service
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/twixcy_user_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:YOUR_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

twixcy.upload.dir=${user.dir}/backend/customer-service/uploads/images
twixcy.upload.max-size-mb=5
twixcy.upload.public-base-url=http://localhost:8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
