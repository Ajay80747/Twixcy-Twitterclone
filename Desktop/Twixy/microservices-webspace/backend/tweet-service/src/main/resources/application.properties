spring.application.name=tweet-service
server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/twixcy_tweet_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:YOUR_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ── Image Upload ──────────────────────────────────────────────────────────────
# Directory to store uploaded images (relative to working dir, or absolute path)
twixcy.upload.dir=uploads/images
# Maximum file size in megabytes
twixcy.upload.max-size-mb=5
# Base URL used when building the returned image URL.
# Images are served through the gateway (port 8080) via the existing /api/tweets/** route.
# The gateway's SessionAuthFilter makes /api/tweets/images/* public so no auth is required
# to view images, while /api/tweets/upload-image still requires a valid session.
twixcy.upload.public-base-url=http://localhost:8080

# Spring multipart settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=8MB
